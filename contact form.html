<!DOCTYPE html>
<html lang="en">
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="section-one">
            <h1 class="section-one__name">Dharshini</h1>
            <p class="section-one__role">Web Developer And Data Analyst</p>
            <a class="section-one__contact" href="index.html">Home</a>
        </div>
        <div class="contact.form">
            <form>
                <table>
                    <tr>
                        <td>Name:</td>
                        <td><input type="text" placeholder="Enter your Name" class="contact-form__input"></td> <br>
                    </tr>
                    <tr>
                        <td>Email:</td>
                        <td><input type="Email" placeholder="Enter your Email ID" class="contact-form__input"></td> <br>
                    </tr>
                    <tr>
                        <td>Message:</td>
                        <td> <textarea placeholder="Enter your Message" class="contact-form__textarea"></textarea></td> <br>
                    </tr>
                    <tr>
                        <td> </td>
                        <td> <input type="submit" class="contact-form__submit"></td>
                    </tr>
                </table>
            </form>
        </div>
        <div class="section-five">
            <p class="section-five__title">Socialmedia:
                <a href="https://github.com/" target="_blank">GitHub</a>
                <a href="https://www.linkedin.com/" target="_blank">linkedin</a>
            </p>
            <p class="section-five__dsec">&copy;Dharshini</p>
        </div>
    </div>
</body>

</html>
